# Default locale (also the fallback). Keys: see `zh_TW.yml`.
lang: en
extName: Better Manga
extDescription: Enhances manga reading sites.

popup:
  currentSite: This page
  unsupportedSite: The current tab is not a supported site
  unsupportedSiteHint: Browse every supported site in the settings.
  openOptions: Settings
  reloadHint: Reload the page to fully apply
  reload: Reload

language:
  label: Language
  auto: Browser default

globalSettings:
  title: All sites
  description: Applies everywhere; any site can override it.
  reset: Reset to defaults

siteSettings:
  enabled: Enabled on this site
  disabled: Disabled
  disabledHint: 'Better Manga is off on this site: none of its features run.'
  customised: Customised
  customisedHint: This site has its own settings
  followGlobal: Follow all sites
  noSettings: This site has no adjustable settings.
  hostSeparator: ', '

options:
  sites: Sites
  sitesDescription: Open a site to give it its own settings or turn it off.
  search: Search by name, domain or URL
  filterAll: All
  filterCustomised: Customised
  filterDisabled: Disabled
  noResults: No matching sites
  noResultsHint: Try another keyword, or paste the URL of a manga page.
  showMore: Show more ($1 left)

featureGroups:
  distractions: Ads & distractions
  loading: Loading
  reading: Reading

blockAds:
  title: Block ads
  description: Hides ads and stops clicks from taking you to ad pages.

skipRedirects:
  title: Skip redirect pages
  description: Opens chapters directly, so a redirect page can't break fullscreen.

autoContinue:
  title: Auto-click “Continue”
  description: Clicks buttons like “Click to continue reading” for you as soon as they appear.

fastLoad:
  title: Load images faster
  description: Shows chapter images sooner. Only preloading the next chapter uses extra data, and Data Saver turns preloading off.
  connect: Connect early
  connectDescription: Connects to the image servers as soon as the page opens.
  preloadImages: Preload this chapter
  preloadImagesDescription: Downloads several images at once instead of one by one.
  parallel: Downloads at once
  parallelValue: $1 at once
  preloadNext: Preload next chapter
  preloadNextDescription: Loads it in the background, so it opens instantly.

reloadBrokenImages:
  title: Retry broken images
  description: Reloads images that fail to load, and again once you're back online.

readingHistory:
  title: Reading history
  description: Remembers where you stopped in each series and takes you back there. Stays in this browser.
  continue: Continue reading
  entryDetail: $1 · $2 · $3
  listDescription: The works you've read, latest first. Kept only in this browser.
  empty: No reading history yet
  emptyHint: Chapters you read on supported sites show up here.
  remove: Remove from history
  clear: Clear history
  clearTitle: Clear reading history?
  clearDescription: Every work is removed from your reading history. This can't be undone.
  clearConfirm: Clear
  cancel: Cancel

pageKeys:
  title: Page Up / Down
  description: Sets how far Page Up / Down scrolls. A little overlap keeps your place.
  ratio: Scroll by
  smooth: Smooth scrolling
  smoothDescription: Scrolls smoothly so your eyes can follow. Hold the key to keep scrolling.
  duration: Animation length
  durationValue: $1 ms
  holdSpeed: Speed while held
  holdSpeedValue: $1 screens/s

optionSlider:
  default: Default $1
