# Default locale (also the fallback). Keys: see `zh_TW.yml`.
lang: en
extName: Better Manga
extDescription: Enhances manga reading sites.

popup:
  currentSite: This page
  unsupportedSite: The current tab is not a supported site
  unsupportedSiteHint: Browse every supported site in the settings.
  openOptions: Settings
  reloadHint: Reload the page to fully apply
  reload: Reload

language:
  label: Language
  auto: Browser default

globalSettings:
  title: All sites
  description: Applies everywhere; any site can override it.
  reset: Reset to defaults

siteSettings:
  enabled: Enabled on this site
  disabled: Disabled
  disabledHint: 'Better Manga is off on this site: none of its features run.'
  customised: Customised
  customisedHint: This site has its own settings
  followGlobal: Follow all sites
  noSettings: This site has no adjustable settings.
  hostSeparator: ', '

options:
  sites: Sites
  sitesDescription: Open a site to give it its own settings or turn it off.
  search: Search by name, domain or URL
  filterAll: All
  filterCustomised: Customised
  filterDisabled: Disabled
  noResults: No matching sites
  noResultsHint: Try another keyword, or paste the URL of a manga page.
  showMore: Show more ($1 left)

blockAds:
  title: Block ads
  description: Hides ad slots and stops scripts that send you to ads when you click.

skipRedirects:
  title: Direct chapter links
  description: Opens chapters directly instead of via redirect pages, so fullscreen isn't interrupted.

autoContinue:
  title: Auto-continue
  description: Clicks buttons like “Click to continue reading” as soon as they appear.

fastLoad:
  title: Faster loading
  description: Gets chapter images on screen sooner. Only the next chapter costs extra data, and nothing is preloaded under Data Saver.
  connect: Connect early
  connectDescription: Connects to the image servers as the page opens.
  preloadImages: Preload this chapter
  preloadImagesDescription: Downloads its images several at a time, not one by one.
  parallel: Downloads at a time
  parallelValue: $1 at a time
  preloadNext: Preload the next chapter
  preloadNextDescription: Fetches it in the background once this one is in, so it opens at once.

pageDistance:
  title: Page Up / Down distance
  description: Scrolls a fixed share of the screen height, keeping some overlap so you don't lose your place.
  ratio: Scroll ratio

smoothScroll:
  title: Smooth Page Up / Down
  description: Animates Page Up / Down so you can follow along. Presses add up, holding the key glides, letting go eases to a stop.
  duration: Animation length
  durationValue: $1 ms
  holdSpeed: Speed while held
  holdSpeedValue: $1 screens/s

optionSlider:
  default: Default $1
