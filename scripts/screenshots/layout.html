<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        box-sizing: border-box;
      }
      body {
        width: 1280px;
        height: 800px;
        overflow: hidden;
        font-family: 'PingFang TC', system-ui, sans-serif;
        color: #1a1a1a;
        background: #f5f2ea radial-gradient(#1a1a1a14 1.4px, transparent 1.6px) 0 0/14px 14px;
        display: flex;
        align-items: center;
        gap: 72px;
        padding: 0 96px;
      }
      .copy {
        flex: 1;
      }
      .brand {
        display: flex;
        align-items: center;
        gap: 18px;
        margin-bottom: 36px;
      }
      .brand img {
        width: 84px;
        height: 84px;
      }
      .brand h1 {
        font-size: 44px;
        font-weight: 800;
        letter-spacing: -0.5px;
      }
      h2 {
        font-size: 40px;
        font-weight: 800;
        line-height: 1.3;
        margin-bottom: 36px;
      }
      h2 em {
        font-style: normal;
        color: #e8453c;
      }
      ul {
        list-style: none;
        padding: 0;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      li {
        font-size: 22px;
        line-height: 1.45;
        display: flex;
        gap: 14px;
        align-items: flex-start;
      }
      li::before {
        content: '';
        flex: none;
        width: 12px;
        height: 12px;
        margin-top: 10px;
        background: #e8453c;
        transform: rotate(45deg);
      }
      .sites {
        margin-top: 40px;
        font-size: 17px;
        color: #1a1a1a99;
      }
      .card {
        flex: none;
        width: 493px;
        border-radius: 20px;
        overflow: hidden;
        background: #fff;
        box-shadow:
          0 0 0 1px #1a1a1a1f,
          0 30px 60px -20px #1a1a1a55;
      }
      .card img {
        display: block;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div class="copy">
      <div class="brand">
        <img src="../../src/assets/logo.svg" />
        <h1>Better Manga</h1>
      </div>
      <h2>讓漫畫網站<br /><em>讀起來更順手</em></h2>
      <ul>
        <li>Page Up / Down 依比例捲動，不漏看任何一格</li>
        <li>隱藏廣告區塊，自動點擊「繼續閱讀」</li>
        <li>阻止章節連結被導向廣告頁</li>
        <li>每個網站各自設定，不收集任何資料</li>
      </ul>
      <p class="sites">支援：包子漫畫・G站漫畫・嬉皮漫畫</p>
    </div>
    <div class="card"><img id="popup" alt="" /></div>
  </body>
</html>
